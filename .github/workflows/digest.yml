# Dependency vulnerability digest (docs/specs/001-vuln-digest.md): once a day, read the open
# Dependabot alerts of every repository the digest's GitHub App can see, diff them with the
# previous run and send a Telegram message only when an alert opens or resolves.
#
# Started by the jobs Worker (platform-jobs-worker job `vuln-digest`, 01:17 UTC) through
# workflow_dispatch, like the other moved schedules (ADR-0008). Public repository: the log prints
# only counts per severity and an error type; findings go only to Telegram and state lives in the
# private R2 bucket vuln-digest. A failed or missed run alerts through the uptime Worker
# heartbeat `vuln-digest` (30 h).
name: Vuln digest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vuln-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VULN_R2_ENDPOINT: ${{ secrets.VULN_R2_ENDPOINT }}
      VULN_R2_ACCESS_KEY_ID: ${{ secrets.VULN_R2_ACCESS_KEY_ID }}
      VULN_R2_SECRET_ACCESS_KEY: ${{ secrets.VULN_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Digest
        id: run
        env:
          VULN_GITHUB_APP_ID: ${{ secrets.VULN_GITHUB_APP_ID }}
          VULN_GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets.VULN_GITHUB_APP_PRIVATE_KEY_PEM }}
          VULN_OWNERS: ${{ secrets.VULN_OWNERS }}
          VULN_EXCLUDE: ${{ secrets.VULN_EXCLUDE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python -m vuln_digest.r2 get state.json "$RUNNER_TEMP/previous.json" 2> "$RUNNER_TEMP/stderr.log"
          code=$?
          if [ "$code" -eq 0 ]; then
            # stdout is the counts-only summary; stderr stays in a runner temp file, out of the public log.
            python -m vuln_digest --state-in "$RUNNER_TEMP/previous.json" --state-out "$RUNNER_TEMP/current.json" \
              2>> "$RUNNER_TEMP/stderr.log" | tee -a "$GITHUB_STEP_SUMMARY"
            code=${PIPESTATUS[0]}
          fi
          # A failed sweep writes no current.json, so nothing resolves; a refused Telegram message
          # (exit 3) is kept in current.json and sent first next run.
          if [ -f "$RUNNER_TEMP/current.json" ]; then
            python -m vuln_digest.r2 put state.json "$RUNNER_TEMP/current.json" 2>> "$RUNNER_TEMP/stderr.log" || code=2
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Heartbeat
        if: ${{ always() }}
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
          CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          if [ "$CODE" = 0 ]; then body='{"ok":true,"failed":[]}'; else body='{"ok":false,"failed":["vuln-digest"]}'; fi
          curl -fsS -X POST https://monitor.bookchaowalit.com/heartbeat/vuln-digest \
            -H "Authorization: Bearer $HEARTBEAT_TOKEN" -H "Content-Type: application/json" -d "$body"
